name: CKB Binary Integration Tests

run-name: CKB binary tests - ${{ inputs.test_cases }}

on:
  workflow_dispatch:
    inputs:
      binary_url:
        description: URL of the CKB .tar.gz binary package
        required: true
        type: string
        default: https://fiber-download.s3-accelerate.amazonaws.com/ckb_v0.208.0-new.tar.gz
      binary_sha256:
        description: Optional SHA-256 checksum of the downloaded package
        required: false
        type: string
      test_cases:
        description: Space-separated pytest paths, or all for the standard suite
        required: true
        type: string
        default: all

permissions:
  contents: read

jobs:
  integration-tests:
    # The supplied binary requires GLIBC_2.39; Ubuntu 22.04 only provides
    # glibc 2.35, while Ubuntu 24.04 provides a compatible glibc.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout test repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare integration test dependencies
        run: |
          # The v0.208.0-rc0 GitHub asset listed in download.py is no longer
          # available. The v0.208 binary is supplied by binary_url below, so
          # download only the versions required by the standard test suite.
          python - <<'PY'
          import download

          download.versions = [
              "0.200.0",
              "0.201.0",
              "0.202.0",
              "0.203.0",
              "0.204.0",
              "0.205.0",
              "0.206.0",
              "0.207.0",
          ]
          download.main()
          PY
          python -m download_ckb_light_client
          bash prepare.sh

      - name: Replace download/current/ckb with binary package
        env:
          CKB_BINARY_URL: ${{ inputs.binary_url }}
          CKB_BINARY_SHA256: ${{ inputs.binary_sha256 }}
        run: |
          set -euo pipefail

          package_file="$RUNNER_TEMP/ckb-binary-package.tar.gz"
          extract_dir="$RUNNER_TEMP/ckb-binary-package"
          target_dir="download/current"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir" "$target_dir"

          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$package_file" "$CKB_BINARY_URL"

          if [ -n "$CKB_BINARY_SHA256" ]; then
            echo "$CKB_BINARY_SHA256  $package_file" | sha256sum --check --strict -
          fi

          tar --extract --gzip --file "$package_file" --directory "$extract_dir"
          ckb_binary="$(find "$extract_dir" -type f -name ckb -print -quit)"
          if [ -z "$ckb_binary" ]; then
            echo "The package does not contain a ckb binary" >&2
            exit 1
          fi

          install -m 0755 "$ckb_binary" "$target_dir/ckb"
          test -x "$target_dir/ckb-cli"
          "$target_dir/ckb" --version
          "$target_dir/ckb-cli" --version

      - name: Run integration tests
        env:
          TEST_CASES: ${{ inputs.test_cases }}
        run: |
          set -euo pipefail
          if [ "$TEST_CASES" = "all" ]; then
            make test
          else
            read -r -a test_targets <<< "$TEST_CASES"
            if [ "${#test_targets[@]}" -eq 0 ]; then
              echo "test_cases must not be empty" >&2
              exit 1
            fi
            python -m pytest -vv "${test_targets[@]}"
          fi

      - name: Stop remaining CKB processes
        if: always()
        run: pkill -9 ckb || true

      - name: Upload failure reports and node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ckb-binary-integration-test-reports
          path: |
            report
            tmp/**/node.log
            tmp/**/ckb.miner.log
          if-no-files-found: ignore
          retention-days: 7
