# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: ci_integration_tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "V210" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

       # os: [ubuntu-22.04, macos-latest]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ckb-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        python -m pip install 'psycopg[binary]==3.2.10'
      
    - name: Install dependencies
      run: make prepare

    - name: Run tests
      run: make test
      env:
        CKB_TEST_PG_HOST: 127.0.0.1
        CKB_TEST_PG_PORT: ${{ job.services.postgres.ports[5432] }}
        CKB_TEST_PG_USER: postgres
        CKB_TEST_PG_PASSWORD: ckb-test-only

#    - name: Setup upterm session
#      if: always()
#      uses: lhotari/action-upterm@v1
       
    - name: Publish reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: jfoa-build-reports-${{ runner.os }}
        path: ./report
